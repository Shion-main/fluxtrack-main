<goal_backward>\r
\r
## Goal-Backward Methodology\r
\r
**Forward planning:** "What should we build?" → produces tasks.\r
**Goal-backward:** "What must be TRUE for the goal to be achieved?" → produces requirements tasks must satisfy.\r
\r
## The Process\r
\r
**Step 0: Extract Requirement IDs**\r
Read ROADMAP.md `**Requirements:**` line for this phase. Strip brackets if present (e.g., `[AUTH-01, AUTH-02]` → `AUTH-01, AUTH-02`). Distribute requirement IDs across plans — each plan's `requirements` frontmatter field MUST list the IDs its tasks address. **CRITICAL:** Every requirement ID MUST appear in at least one plan. Plans with an empty `requirements` field are invalid.\r
\r
**Security (when `security_enforcement` enabled — absent = enabled):** Identify trust boundaries in this phase's scope. Map STRIDE categories to applicable tech stack from RESEARCH.md security domain. For each threat: assign a **severity** (critical|high|medium|low) based on impact × likelihood, and a disposition (`mitigate`/`accept`/`transfer`) per the configured OWASP ASVS level — see @C:/Users/joshu_mnu8z3u/Downloads/fluxtrack-main/.Codex/gsd-core/references/security-asvs-levels.md. Every plan MUST include `<threat_model>` when security_enforcement is enabled.\r
\r
**Package legitimacy gate (npm/pip/cargo only):**\r
- Require RESEARCH.md `## Package Legitimacy Audit` before package-manager install tasks.\r
- If install tasks exist and the table is missing/malformed, stop planning:\r
  `Package installs detected but audit table not found — researcher must run Package Legitimacy Gate protocol`\r
  Fallback policy: treat all packages as `[ASSUMED]`.\r
- For each `[ASSUMED]`/`[SUS]` package, insert `<task type="checkpoint:human-verify" gate="blocking-human">` before install and verify via `npmjs.com/package`, `pypi.org/project`, or `crates.io/crates`.\r
- `[SLOP]` packages are forbidden; legitimacy checkpoints are never auto-approvable (`workflow.auto_advance` ignored). Keep `T-{phase}-SC` in `<threat_model>`.\r
\r
**Step 1: State the Goal**\r
Take phase goal from ROADMAP.md. Must be outcome-shaped, not task-shaped.\r
- Good: "Working chat interface" (outcome)\r
- Bad: "Build chat components" (task)\r
\r
**Step 2: Derive Observable Truths**\r
"What must be TRUE for this goal to be achieved?" List 3-7 truths from USER's perspective.\r
\r
**Step 3: Derive Required Artifacts**\r
For each truth: "What must EXIST for this to be true?"\r
\r
**Step 4: Derive Required Wiring**\r
For each artifact: "What must be CONNECTED for this to function?"\r
\r
**Step 5: Identify Key Links**\r
"Where is this most likely to break?" Key links = critical connections where breakage causes cascading failures.\r
\r
See @C:/Users/joshu_mnu8z3u/Downloads/fluxtrack-main/.Codex/gsd-core/references/planner-guidance.md for a worked example and the `must_haves` YAML format.\r
\r
</goal_backward>\r
