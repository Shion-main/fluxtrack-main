{% load static %}<!doctype html>
<html lang="en" data-offline-shell><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FluxTrack offline capture</title>
<style>body{font:18px system-ui;max-width:36rem;margin:2rem auto;padding:1rem}input,textarea,button{display:block;margin:1rem 0;padding:.7rem;width:100%;box-sizing:border-box}.hidden{display:none}</style>
<script src="{% static 'checker/offline_queue.js' %}" defer></script></head><body>
<h1>Offline room capture</h1><p>Record a room observation for the last account used on this device. Reconnect and sign into that same account to sync. Live attendance is unavailable.</p>
<p id="account-label"></p><div id="offline-banner"><p id="offline-banner-text"></p></div>
<form id="capture"><label>Six-digit room code or QR link<input id="payload" required></label><label>Observation<select id="action"><option value="verified">Verify present</option><option value="verified_empty">Confirm empty</option><option value="flag_not_present">Flag not present</option></select></label><label>Note<textarea id="note" maxlength="255"></textarea></label><button>Save observation</button></form><p id="status" role="status"></p><a href="/login">Reconnect and sign in</a>
<script>document.addEventListener('DOMContentLoaded',function(){const q=window.FluxTrackOfflineQueue;document.getElementById('account-label').textContent=q&&q.ownerLabel?'Device account label: '+q.ownerLabel+' (confirmed at sync)':'No saved account. Reconnect and open the checker scan page before capturing.';});document.getElementById('capture').addEventListener('submit', async function(e){e.preventDefault();const status=document.getElementById('status');const action=document.getElementById('action').value;const note=document.getElementById('note').value.trim();if(action==='flag_not_present'&&!note){status.textContent='A note is required to flag.';return;}try{await window.FluxTrackOfflineQueue.enqueue({payload:document.getElementById('payload').value,action:action,note:note});status.textContent='Saved on this device. Sign in as the original account to sync.';this.reset();}catch(error){status.textContent='Cannot save: '+error.message;}});</script></body></html>
